name: Tuesday scout

# Every Tuesday: freeze the week that just finished, rank its games, and post the scout's report as an issue
# assigned to the owner, so it arrives as a GitHub notification (app push + email). No secrets needed.
on:
  schedule:
    - cron: "0 14 * * 2" # Tuesdays 14:00 UTC: 9 AM Central (8 AM once clocks fall back)
    - cron: "0 14 * * 3" # Wednesday retry, in case Sleeper finalizes the week late
  workflow_dispatch:
    inputs:
      week:
        description: "Redo a specific week (leave blank for the latest finished week)"
        required: false

permissions:
  actions: write # to start Publish
  contents: write
  issues: write
  pull-requests: write # weekly data follows the protected main branch's PR requirement

concurrency: site-data # never races the Blurb job

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      REPORT_FILE: /tmp/spf-report.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs the TypeScript in lib/ directly; no npm install needed
      - name: Freeze the week and scout it
        env:
          WEEK_INPUT: ${{ inputs.week }}
        run: node scripts/tuesday.mjs "$WEEK_INPUT"
      - name: Save the week and post the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$REPORT_FILE" ] || exit 0 # nothing new this run
          week=$(head -1 "$REPORT_FILE")
          npm run check
          node scripts/save-week.mjs "$week" snapshot
          tail -n +2 "$REPORT_FILE" > "$RUNNER_TEMP/body.md"
          title="Week $week is final: the scout's top three"
          existing=$(gh issue list --state all --author 'github-actions[bot]' --limit 100 --json title --jq "map(select(.title == \"$title\")) | length")
          if [ "$existing" -eq 0 ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --assignee "${{ github.repository_owner }}"
          fi
          gh workflow run publish.yml --ref main
