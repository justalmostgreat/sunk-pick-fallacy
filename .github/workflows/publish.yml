name: Publish

# Builds the site and publishes it to sunkpick.com, a public Cloudflare Worker, after every change to main.
# The Tuesday and Blurb jobs start this themselves after they commit, because GitHub doesn't let their pushes trigger it.
# Needs one repo secret: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template, zone sunkpick.com).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false # finish the current upload; the next run checks out the latest main

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Publish to sunkpick.com
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in this repository's Actions secrets, then rerun Publish."
            exit 1
          fi
          npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
