name: Readers

# Last week's reader numbers for sunkpick.com, from Cloudflare. The Tuesday scout puts the same lines in its weekly
# issue; run this from the Actions tab to see them any time. Adds PostHog aggregate engagement with a query-read key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Summarize last week's readers and engagement
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_QUERY_API_KEY: ${{ secrets.POSTHOG_QUERY_API_KEY }}
        run: node scripts/readers.mjs | tee -a "$GITHUB_STEP_SUMMARY"
